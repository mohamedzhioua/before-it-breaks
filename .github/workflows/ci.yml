name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Only for the manual macos job below (macOS minutes bill 10x).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }}, node ${{ matrix.node }})
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Git identity for tests that create repos
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci.invalid"
      - name: Run every check
        env:
          RUN_ALL_LOG_DIR: run-all-logs
        run: node tests/run-all.js
      - name: Keep the full output of failed steps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-all-logs-${{ matrix.os }}-node${{ matrix.node }}
          path: run-all-logs/
          if-no-files-found: ignore

  semgrep-rules:
    name: semgrep rule tests
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: semgrep/semgrep:1.181.0
    steps:
      - uses: actions/checkout@v4
      - name: Run the rule tests
        shell: sh
        run: |
          command -v bash >/dev/null 2>&1 || apk add --no-cache bash
          bash rules/semgrep/run-tests.sh

  checks-macos:
    name: checks (macos-latest, node 22, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Git identity for tests that create repos
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci.invalid"
      - name: Run every check
        env:
          RUN_ALL_LOG_DIR: run-all-logs
        run: node tests/run-all.js
      - name: Keep the full output of failed steps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-all-logs-macos
          path: run-all-logs/
          if-no-files-found: ignore
